<!DOCTYPE html>
<html lang="fr" data-fr-scheme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuille de service journalier</title>

<!--
  Widget personnalisé Grist : génère un PDF "Feuille de service journalier"
  à partir d'une table d'occurrences (Début / Fin / Occurrence).

  Interface conforme au DSFR (Système de Design de l'État) :
  https://www.systeme-de-design.gouv.fr/ — via le package officiel @gouvfr/dsfr.
  Le DSFR régit les interfaces web ; il n'impose pas de gabarit pour les PDF,
  donc le PDF reprend simplement le bleu France (#000091) en accent visuel.
-->

<!-- DSFR (Système de Design de l'État) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr.min.css">

<!-- API du widget Grist -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<!-- jsPDF pour la génération du PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root { --bleu-france: #000091; }
  html, body { margin: 0; padding: 0; }
  .widget-wrap { padding: 1.5rem 1.25rem; max-width: 640px; }
  .fr-logo { transform: scale(0.85); transform-origin: left top; margin-bottom: 0.5rem; }
  #previewZone table caption { text-align: left; }
  .occ-count { color: var(--text-mention-grey); }
  .fr-alert { margin-bottom: 0; }
</style>
</head>
<body>
<div class="widget-wrap">

  <p class="fr-logo">République<br>Française</p>

  <h1 class="fr-h4 fr-mb-1w">Feuille de service journalier</h1>
  <p class="fr-text--sm fr-mb-3w">
    Choisissez un jour puis générez le PDF listant les occurrences de ce jour,
    au format « Heure de début - Heure de fin : <strong>Occurrence</strong> ».
  </p>

  <div class="fr-input-group">
    <label class="fr-label" for="dayPicker">
      Jour à générer
      <span class="fr-hint-text">La date choisie apparaîtra dans le titre du document.</span>
    </label>
    <input class="fr-input" type="date" id="dayPicker" name="dayPicker">
  </div>

  <button class="fr-btn fr-mt-3w" id="generateBtn" type="button" disabled>
    Générer le PDF
  </button>

  <div id="statusZone" class="fr-mt-3w" aria-live="polite"></div>

  <div id="previewZone" class="fr-mt-4w"></div>

</div>

<!-- DSFR : comportements JS (non indispensable ici, mais recommandé par le DSFR) -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr/dsfr.module.min.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr/dsfr.nomodule.min.js"></script>

<script>
(function () {
  'use strict';

  var allRecords = [];
  var recordsLoaded = false;

  var dayPicker = document.getElementById('dayPicker');
  var generateBtn = document.getElementById('generateBtn');
  var statusZone = document.getElementById('statusZone');
  var previewZone = document.getElementById('previewZone');

  // ---- Initialisation du widget Grist ------------------------------------

  // Déclare les colonnes attendues : l'utilisateur les associe à ses propres
  // colonnes ("Début", "Fin", "Occurrence") depuis le panneau de configuration
  // du widget dans Grist. Type "Any" pour accepter Date, DateTime ou Texte.
  grist.ready({
    requiredAccess: 'read table',
    columns: [
      { name: 'Debut', title: 'Heure de début', type: 'Any', optional: false },
      { name: 'Fin', title: 'Heure de fin', type: 'Any', optional: false },
      { name: 'Occurrence', title: 'Occurrence', type: 'Any', optional: false }
    ]
  });

  grist.onRecords(function (records, mappings) {
    var mapped = (grist.mapColumnNames && mappings)
      ? grist.mapColumnNames(records, mappings)
      : records;
    allRecords = (mapped || []).filter(Boolean);
    recordsLoaded = true;
    generateBtn.disabled = false;
    renderPreview();
  });

  // ---- Date du jour par défaut --------------------------------------------

  (function initDate() {
    var today = new Date();
    dayPicker.value = toInputDateValue(today);
  })();

  dayPicker.addEventListener('change', renderPreview);
  generateBtn.addEventListener('click', generatePDF);

  // ---- Parsing des dates Grist ---------------------------------------------

  // Les colonnes Date/DateTime de Grist sont renvoyées via l'API comme un
  // horodatage Unix (en secondes). Si la colonne est du texte au format
  // "JJ/MM/AAAA HH:mm", on la parse directement.
  function parseGristDateTime(value) {
    if (value === null || value === undefined) return null;

    if (typeof value === 'number') {
      return new Date(value * 1000);
    }

    if (value instanceof Date) return value;

    if (typeof value === 'string') {
      var m = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]+(\d{1,2}):(\d{2})/);
      if (m) {
        var d = parseInt(m[1], 10);
        var mo = parseInt(m[2], 10);
        var y = parseInt(m[3], 10);
        var h = parseInt(m[4], 10);
        var mi = parseInt(m[5], 10);
        return new Date(y, mo - 1, d, h, mi);
      }
      var parsed = new Date(value);
      if (!isNaN(parsed.getTime())) return parsed;
    }

    return null;
  }

  function toInputDateValue(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function getSelectedDate() {
    var val = dayPicker.value;
    if (!val) return new Date();
    var parts = val.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
  }

  function fmtHM(date) {
    if (!date) return '--:--';
    var h = String(date.getHours()).padStart(2, '0');
    var m = String(date.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  function fmtDayTitle(date) {
    var d = String(date.getDate()).padStart(2, '0');
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var y = date.getFullYear();
    return d + '/' + m + '/' + y;
  }

  // ---- Sélection et tri des occurrences du jour -----------------------------

  function getOccurrencesForDay(day) {
    return allRecords
      .map(function (r) {
        return {
          debut: parseGristDateTime(r.Debut),
          fin: parseGristDateTime(r.Fin),
          occurrence: (r.Occurrence === null || r.Occurrence === undefined) ? '' : String(r.Occurrence)
        };
      })
      .filter(function (r) { return r.debut && sameDay(r.debut, day); })
      .sort(function (a, b) { return a.debut - b.debut; });
  }

  // ---- Aperçu dans le widget -------------------------------------------------

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderPreview() {
    if (!recordsLoaded) {
      previewZone.innerHTML = '';
      return;
    }
    var day = getSelectedDate();
    var occ = getOccurrencesForDay(day);

    if (occ.length === 0) {
      previewZone.innerHTML =
        '<div class="fr-alert fr-alert--info fr-alert--sm">' +
        '<p>Aucune occurrence trouvée pour le ' + escapeHtml(fmtDayTitle(day)) + '.</p>' +
        '</div>';
      return;
    }

    var rows = occ.map(function (o) {
      return '<tr>' +
        '<td>' + escapeHtml(fmtHM(o.debut)) + ' - ' + escapeHtml(fmtHM(o.fin)) + '</td>' +
        '<td><strong>' + escapeHtml(o.occurrence) + '</strong></td>' +
        '</tr>';
    }).join('');

    previewZone.innerHTML =
      '<p class="fr-text--sm occ-count">' + occ.length + ' occurrence(s) pour le ' + escapeHtml(fmtDayTitle(day)) + '</p>' +
      '<table class="fr-table fr-table--sm" aria-label="Aperçu de la feuille de service">' +
      '<thead><tr><th scope="col">Horaires</th><th scope="col">Occurrence</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  // ---- Génération du PDF -------------------------------------------------

  function showStatus(type, message) {
    // type: 'success' | 'error' | 'info'
    statusZone.innerHTML =
      '<div class="fr-alert fr-alert--' + type + ' fr-alert--sm">' +
      '<p>' + escapeHtml(message) + '</p>' +
      '</div>';
  }

  function generatePDF() {
    if (!recordsLoaded) return;

    var day = getSelectedDate();
    var occ = getOccurrencesForDay(day);

    if (occ.length === 0) {
      showStatus('warning', 'Aucune occurrence à exporter pour le ' + fmtDayTitle(day) + '.');
      return;
    }

    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) {
      showStatus('error', 'La bibliothèque de génération PDF (jsPDF) n\'a pas pu être chargée.');
      return;
    }

    var doc = new jsPDFCtor({ unit: 'mm', format: 'a4' });
    var marginLeft = 20;
    var marginRight = 20;
    var marginTop = 22;
    var marginBottom = 20;
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var lineHeight = 7.5;
    var y = marginTop;

    var bleuFrance = [0, 0, 145]; // #000091 — Bleu France (DSFR)

    // Titre
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.setTextColor(bleuFrance[0], bleuFrance[1], bleuFrance[2]);
    var title = 'Feuille de service journalier du ' + fmtDayTitle(day);
    doc.text(title, pageWidth / 2, y, { align: 'center' });

    y += 4;
    doc.setDrawColor(bleuFrance[0], bleuFrance[1], bleuFrance[2]);
    doc.setLineWidth(0.5);
    doc.line(marginLeft, y, pageWidth - marginRight, y);
    y += lineHeight * 1.6;

    doc.setTextColor(0, 0, 0);
    doc.setFontSize(11);

    occ.forEach(function (o) {
      if (y > pageHeight - marginBottom) {
        doc.addPage();
        y = marginTop;
      }

      var prefix = fmtHM(o.debut) + ' - ' + fmtHM(o.fin) + ' : ';
      doc.setFont('helvetica', 'normal');
      doc.text(prefix, marginLeft, y);
      var prefixWidth = doc.getTextWidth(prefix);

      doc.setFont('helvetica', 'bold');
      var maxWidth = pageWidth - marginLeft - marginRight - prefixWidth;
      var wrapped = doc.splitTextToSize(o.occurrence || '', maxWidth > 10 ? maxWidth : pageWidth - marginLeft - marginRight);

      if (maxWidth > 10) {
        doc.text(wrapped[0] || '', marginLeft + prefixWidth, y);
        for (var i = 1; i < wrapped.length; i++) {
          y += lineHeight;
          if (y > pageHeight - marginBottom) {
            doc.addPage();
            y = marginTop;
          }
          doc.text(wrapped[i], marginLeft + prefixWidth, y);
        }
      } else {
        // Occurrence trop longue pour tenir à côté du préfixe : ligne suivante
        y += lineHeight;
        if (y > pageHeight - marginBottom) {
          doc.addPage();
          y = marginTop;
        }
        var wrappedFull = doc.splitTextToSize(o.occurrence || '', pageWidth - marginLeft - marginRight);
        wrappedFull.forEach(function (line, idx) {
          if (idx > 0) {
            y += lineHeight;
            if (y > pageHeight - marginBottom) {
              doc.addPage();
              y = marginTop;
            }
          }
          doc.text(line, marginLeft, y);
        });
      }

      y += lineHeight;
    });

    var filename = 'Feuille_de_service_' + fmtDayTitle(day).replace(/\//g, '-') + '.pdf';
    doc.save(filename);
    showStatus('success', 'PDF généré : ' + filename);
  }

})();
</script>
</body>
</html>
